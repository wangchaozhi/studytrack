services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studytrack}
      POSTGRES_USER: ${POSTGRES_USER:-studytrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studytrack}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studytrack} -d ${POSTGRES_DB:-studytrack}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://studytrack:studytrack@db:5432/studytrack?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      HTTP_ADDR: :8080
      APP_ENV: production
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000},http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:${API_PORT:-8080}/api/v1}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  postgres_data:
